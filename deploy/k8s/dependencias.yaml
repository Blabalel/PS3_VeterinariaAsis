apiVersion: v1
kind: Namespace
metadata:
  name: veterinaria
---
apiVersion: v1
kind: Service
metadata:
  name: db
  namespace: veterinaria
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-datos
  namespace: veterinaria
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: veterinaria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16
          env:
            - name: POSTGRES_DB
              value: veterinaria
            - name: POSTGRES_USER
              value: veterinaria
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: veterinaria-local
                  key: POSTGRES_PASSWORD
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: [pg_isready, -h, 127.0.0.1, -U, veterinaria, -d, veterinaria]
          volumeMounts:
            - name: postgres-datos
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-datos
          persistentVolumeClaim:
            claimName: postgres-datos
---
apiVersion: v1
kind: Service
metadata:
  name: objetos
  namespace: veterinaria
spec:
  selector:
    app: objetos
  ports:
    - port: 8333
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: fotos-datos
  namespace: veterinaria
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: objetos
  namespace: veterinaria
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: objetos
  template:
    metadata:
      labels:
        app: objetos
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.53
          args: [mini, "-dir=/data", "-ip.bind=0.0.0.0"]
          env:
            - name: S3_BUCKET
              value: triaje-fotos
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: veterinaria-local
                  key: AWS_ACCESS_KEY_ID
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: veterinaria-local
                  key: AWS_SECRET_ACCESS_KEY
          ports:
            - containerPort: 8333
          readinessProbe:
            tcpSocket:
              port: 8333
          volumeMounts:
            - name: fotos-datos
              mountPath: /data
      volumes:
        - name: fotos-datos
          persistentVolumeClaim:
            claimName: fotos-datos
